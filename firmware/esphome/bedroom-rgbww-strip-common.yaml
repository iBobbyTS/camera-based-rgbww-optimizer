substitutions:
  device_name: bedroom-rgbww-strip
  friendly_name: Bedroom RGBWW Strip
  pwm_frequency: 19531Hz

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "GLEDOPTO GL-C-211WL ESPHome candidate for five independent RGBWW PWM channels."
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: apply_rgbww_12bit
          red: 0
          green: 0
          blue: 0
          warm_white: 0
          cold_white: 0

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: set_rgbww_12bit
      variables:
        red: int
        green: int
        blue: int
        warm_white: int
        cold_white: int
      then:
        - script.execute:
            id: apply_rgbww_12bit
            red: !lambda return red;
            green: !lambda return green;
            blue: !lambda return blue;
            warm_white: !lambda return warm_white;
            cold_white: !lambda return cold_white;
    - action: all_off
      then:
        - script.execute:
            id: apply_rgbww_12bit
            red: 0
            green: 0
            blue: 0
            warm_white: 0
            cold_white: 0

globals:
  - id: rgbww_state_generation
    type: uint32_t
    restore_value: false
    initial_value: '0'

text_sensor:
  - platform: template
    id: rgbww_commanded_state
    name: RGBWW Commanded State
    entity_category: diagnostic
    update_interval: never

script:
  - id: apply_rgbww_12bit
    mode: queued
    parameters:
      red: int
      green: int
      blue: int
      warm_white: int
      cold_white: int
    then:
      - lambda: |-
          auto bounded = [](int value) -> int {
            if (value <= 0) return 0;
            if (value >= 4095) return 4095;
            return value;
          };
          auto level = [](int value) -> float {
            return static_cast<float>(value) / 4095.0f;
          };

          const int r = bounded(red);
          const int g = bounded(green);
          const int b = bounded(blue);
          const int ww = bounded(warm_white);
          const int cw = bounded(cold_white);
          id(pwm_red).set_level(level(r));
          id(pwm_green).set_level(level(g));
          id(pwm_blue).set_level(level(b));
          id(pwm_warm_white).set_level(level(ww));
          id(pwm_cold_white).set_level(level(cw));
          id(rgbww_state_generation) += 1;
          id(rgbww_commanded_state).publish_state(
            std::string("{\"schema_version\":1,\"generation\":")
            + std::to_string(id(rgbww_state_generation))
            + ",\"red\":" + std::to_string(r)
            + ",\"green\":" + std::to_string(g)
            + ",\"blue\":" + std::to_string(b)
            + ",\"warm_white\":" + std::to_string(ww)
            + ",\"cold_white\":" + std::to_string(cw) + "}"
          );

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Bedroom RGBWW Strip Fallback"
    password: !secret fallback_ap_password
    ap_timeout: 90s

captive_portal:

mdns:

output:
  - platform: ledc
    id: pwm_red
    pin: GPIO19
    channel: 0
    frequency: ${pwm_frequency}
    zero_means_zero: true
  - platform: ledc
    id: pwm_green
    pin: GPIO18
    channel: 2
    frequency: ${pwm_frequency}
    zero_means_zero: true
  - platform: ledc
    id: pwm_blue
    pin: GPIO17
    channel: 4
    frequency: ${pwm_frequency}
    zero_means_zero: true
  - platform: ledc
    id: pwm_warm_white
    pin: GPIO4
    channel: 6
    frequency: ${pwm_frequency}
    zero_means_zero: true
  - platform: ledc
    id: pwm_cold_white
    pin: GPIO16
    channel: 8
    frequency: ${pwm_frequency}
    zero_means_zero: true
